name: Weekly report

# Sunday late morning, before the Sunday product research: measures the last 7 days
# of posts, saves reports/latest.md for the research to read, and opens an issue
# so the report lands in GitHub notifications. On a pull request that changes the
# report code it only test-runs and shows the result in the run summary.

on:
  schedule:
    - cron: "0 16 * * 0"   # 12pm ET in summer, 11am in winter
  workflow_dispatch:
  pull_request:
    paths: ["dtd/report.py", "dtd/instagram.py", ".github/workflows/report.yml"]

permissions:
  contents: write
  issues: write

concurrency:
  group: state-writes
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build the report
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python -m dtd report
          cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save the report and open an issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "daily-tech-drops-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ state/
          git diff --cached --quiet || git commit -m "Weekly report"
          git pull --rebase origin "${{ github.ref_name }}"
          git push
          TITLE=$(head -1 reports/latest.md | sed 's/^## //')
          gh issue create --title "$TITLE" --body-file reports/latest.md --assignee "${{ github.repository_owner }}"
